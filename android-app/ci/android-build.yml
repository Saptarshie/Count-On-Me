name: Android Build (Count-On-Me)

# Cloud build: produces a debug APK on every push without any local SDK.
# Copy this file to <repo-root>/.github/workflows/android-build.yml to enable.

on:
  push:
    branches: [main, master]
    paths:
      - "android-app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web deps + build
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Count-On-Me-debug-apk
          path: android-app/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14